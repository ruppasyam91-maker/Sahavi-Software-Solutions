services:
  - type: web
    name: sahavi-contact-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: https://ruppasyam91-maker.github.io
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        value: mabala@sahavi.in
      - key: RESEND_FROM_EMAIL
        sync: false
